name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v || echo "No tests directory yet"

      - name: Lint
        run: pip install flake8 && flake8 tsdb/ --max-line-length=120 --ignore=E501 || true
